[project]
name = "pyproresult"
dynamic = ["version"]
description = "Library for interfacing with Proresult"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"

keywords = ["proresult", "api", "client", "hms", "hse"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/asterisk-digital/pyproresult"
Repository = "https://github.com/asterisk-digital/pyproresult"
Issues = "https://github.com/asterisk-digital/pyproresult/issues"

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "tox==4.50.3",
    "tox-uv==1.33.4",
    "pytest==9.0.2",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3", "setuptools-scm==8.3.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The `-test` tag suffix routes releases to TestPyPI and is stripped from the version.
tag_regex = "^v(?P<version>[^-]+)(?:-test)?$"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyproresult*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
