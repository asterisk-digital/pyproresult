[project]
name = "pyproresult"
version = "1.0.0"
description = "Library for interfacing with Proresult"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "lxml==6.0.2",
    "requests==2.33.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "tox==4.50.3",
    "tox-uv==1.33.4",
    "pytest==9.0.2",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
