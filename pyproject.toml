[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproresult"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "attrs==24.2.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "exceptiongroup==1.2.2",
    "idna==3.10",
    "iniconfig==2.0.0",
    "lxml>=6.0.2",
    "packaging==24.1",
    "pip-review==1.3.0",
    "pluggy==1.5.0",
    "pytest==8.3.3",
    "python-dotenv>=1.1.1",
    "requests==2.32.3",
    "tomli==2.0.1",
    "urllib3==2.6.0",
]

[project.optional-dependencies]
dev = [
    "setuptools",
    "wheel",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
